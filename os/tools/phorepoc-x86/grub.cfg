set timeout=0
set default=0
# UEFI (the x86_64-efi half of the grub-mkrescue hybrid): the multiboot2 framebuffer request needs a GOP video driver
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
fi

menuentry "Phorepoc x86_64 (PHOREPOC ALIVE)" {
    multiboot2 /boot/phorepoc.elf
    boot
}
